<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sistem Informasi Perencanaan dan Penganggaran Bakesbangpoldagri NTB</title>
    <script>
      // Single Page Application redirect script for static servers:
      // Preserves the path and redirects back to root with query param ?p=
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var search = l.search;
        var hash = l.hash;

        // If path is already root, do nothing
        if (pathname === '/' || pathname === '') return;

        // Redirect to root preserving intended path
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?p=' +
          encodeURIComponent(pathname.replace(/^\/+/, '')) +
          (search ? '&q=' + encodeURIComponent(search.replace(/^\?+/, '')) : '') +
          hash;

        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <p>Memuat halaman...</p>
  </body>
</html>
